[application]
name = "Beamer"
out_dir = "dist"
asset_dir = "assets"

[bundle]
identifier = "com.beamer.app"
publisher = "Beamer"
icon = ["assets/icon.ico", "assets/icon.png"]
resources = ["assets/*", "assets/fonts/*"]
copyright = "Copyright Beamer"
category = "Utility"
short_description = "Voice dictation for Windows"
long_description = """
Beamer is a system-tray dictation app that captures your voice, transcribes it using cloud APIs, and injects text into any focused input field.
"""

[bundle.windows]
icon_path = "assets/icon.ico"

# dioxus-cli defaults to OfflineInstaller, which embeds the whole ~250 MB
# WebView2 runtime and produced a 267 MB installer for a 7.6 MB binary.
# WebView2 ships with Windows 11 and is present on most Windows 10 machines, so
# the bootstrapper is the right trade: a small installer that fetches the
# runtime only on the rare machine that lacks it. Switch back to
# OfflineInstaller if Beamer ever has to install somewhere with no network.
[bundle.windows.webview_install_mode.DownloadBootstrapper]
silent = true

[bundle.windows.nsis]
sidebar_image = "installer/welcome.bmp"
header_image = "installer/header.bmp"
installer_icon = "assets/icon.ico"
install_mode = "Both"
display_language_selector = false
start_menu_folder = "Beamer"
