[application]
name = "Beamer"
out_dir = "dist"
asset_dir = "assets"

[bundle]
identifier = "com.beamer.app"
publisher = "Beamer"
icon = ["assets/icon.ico", "assets/icon.png"]
resources = ["assets/*", "assets/fonts/*"]
copyright = "Copyright Beamer"
category = "Utility"
short_description = "Voice dictation"
long_description = """
Beamer is a system-tray dictation app that captures your voice, transcribes it using cloud APIs, and injects text into any focused input field.
"""

[bundle.windows]
icon_path = "assets/icon.ico"

# dioxus-cli defaults to OfflineInstaller, which embeds the whole ~250 MB
# WebView2 runtime and produced a 267 MB installer for a 7.6 MB binary.
# WebView2 ships with Windows 11 and is present on most Windows 10 machines, so
# the bootstrapper is the right trade: a small installer that fetches the
# runtime only on the rare machine that lacks it. Switch back to
# OfflineInstaller if Beamer ever has to install somewhere with no network.
[bundle.windows.webview_install_mode.DownloadBootstrapper]
silent = true

[bundle.windows.nsis]
sidebar_image = "installer/welcome.bmp"
header_image = "installer/header.bmp"
installer_icon = "assets/icon.ico"
install_mode = "Both"
display_language_selector = false
start_menu_folder = "Beamer"
# `!include`d once, at global script scope, between the generated install
# Section's SectionEnd and the generated "Section \"Uninstall\"" — so this
# file defines its own hidden install-time section (K2-Horizon runtime
# placement + dormant Scheduled Task registration) AND its own
# `un.`-prefixed uninstall section (cleanup), both from one file. See
# installer/k2horizon/hooks.nsh and agent_docs/running_on_bearcave.md.
installer_hooks = "installer/k2horizon/hooks.nsh"

# Runtime equivalents of the `-dev` packages the CI Linux job installs to
# build the app (`libwebkit2gtk-4.1-dev`, `libasound2-dev`, `libgtk-3-dev`,
# `libsoup-3.0-dev`, `libxdo-dev`). `libxdo3` matters on its own: the
# injection fallback chain shells out to `xdotool` on Linux, so without it
# the app runs but can't type into anything. Named at their pre-"t64"
# package names on purpose. The time_t-transitioned packages
# (`libgtk-3-0t64`, `libasound2t64`) `Provide:` these names, so apt resolves
# either way, while older non-transitioned distros only ever had these names.
[bundle.deb]
section = "utils"
depends = [
  "libwebkit2gtk-4.1-0",
  "libgtk-3-0",
  "libasound2",
  "libsoup-3.0-0",
  "libxdo3",
]

# Syncthing carries attachment bytes between machines. It is a recommend
# rather than a depend because Beamer works fine on one machine without it,
# and only the images in synced notes need it. apt installs recommends by
# default, so it arrives with the app and can be removed on its own.
recommends = ["syncthing"]

# Carries `sync_server` into the same package as `beamer`. dx has no
# per-platform slot for a second binary in `[bundle]` itself. The one it
# does have, top-level `external_bin`, is read by both the deb bundler and
# the Windows NSIS bundler, so setting it here would make every Windows
# build fail looking for a `sync_server-x86_64-pc-windows-msvc.exe` that
# does not exist. `[bundle.deb.files]` is deb-only: it copies an arbitrary
# local file to an arbitrary path inside the package, so `sync_server` rides
# along without the Windows installer ever knowing this section exists.
# `target/release/sync_server` must already exist when `dx bundle` runs
# (`cargo build --release --bin sync_server` first).
[bundle.deb.files]
"usr/bin/sync_server" = "target/release/sync_server"
# The systemd user unit for the sync server. Without this the package installs
# the binary and `systemctl --user enable beamer-sync` reports the unit does
# not exist, which is what happened on the first install. /usr/lib/systemd/user
# is where packages put user units; nothing is enabled by installing it.
"usr/lib/systemd/user/beamer-sync.service" = "deploy/beamer-sync.service"
