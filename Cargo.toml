[package]
name = "beamer"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "beamer"
path = "src/main.rs"

[[bin]]
name = "ws_test"
path = "src/bin/ws_test.rs"

[[bin]]
name = "voxtral_test"
path = "src/bin/voxtral_test.rs"

[[bin]]
name = "sync_server"
path = "src/bin/sync_server.rs"

[[bin]]
name = "task_eval"
path = "src/bin/task_eval.rs"
# The `#[path]`-included modules carry their own `#[cfg(test)] mod tests`, so
# without this `cargo test` compiles and runs them a second time under this
# binary. Those are duplicates, not coverage, and counting them twice overstates
# the suite. `cargo build` still type-checks this file.
test = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
cpal = "0.15"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
dirs = "6"
keyring = { version = "3", features = ["windows-native", "sync-secret-service"] }
# Pinned to 0.7.10 or newer so the crate and the `dx` CLI stay in step. The
# asset pipeline is shared between them, and a `dx` older than the crate
# bundles assets the crate then cannot resolve. CI installs dioxus-cli at
# the same floor; see .github/workflows/windows.yml.
dioxus = { version = "0.7.10", features = ["desktop"] }
global-hotkey = "0.7"
arboard = { version = "3", features = ["wayland-data-control"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.22"
bytes = "1.12"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
rodio = { version = "0.20", default-features = false, features = ["mp3"] }
reqwest = { version = "0.12", default-features = false, features = ["multipart", "native-tls", "json"] }
self_update = { version = "0.42", features = ["archive-zip"] }
sha2 = "0.10.9"
automerge = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
notify-rust = "4"
mpris = "2"

[target.'cfg(not(target_os = "windows"))'.dependencies]
zbus = "5"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.8"
windows = { version = "0.58", features = [
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
] }

[build-dependencies]
# Unconditional, not `[target.'cfg(target_os = "windows")'.build-dependencies]`:
# build.rs only calls into this crate when cross-compiling to Windows, but
# build-dependencies build for the *host*. Gating this on the target would drop
# it from the Linux host's build graph, and cross-compiling from Linux is
# exactly the case this crate needs to run in. See build.rs for the matching
# runtime check.

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

