[package]
name = "beamer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "beamer"
path = "src/main.rs"

[[bin]]
name = "ws_test"
path = "src/bin/ws_test.rs"

[[bin]]
name = "voxtral_test"
path = "src/bin/voxtral_test.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
dirs = "6"
keyring = { version = "3", features = ["windows-native", "sync-secret-service"] }
dioxus = { version = "0.7", features = ["desktop"] }
global-hotkey = "0.7"
arboard = { version = "3", features = ["wayland-data-control"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
rodio = { version = "0.20", default-features = false, features = ["mp3"] }
reqwest = { version = "0.12", default-features = false, features = ["multipart", "native-tls", "json"] }
self_update = { version = "0.42", features = ["archive-zip"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
notify-rust = "4"
mpris = "2"

[target.'cfg(not(target_os = "windows"))'.dependencies]
zbus = "5"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
winrt-notification = "0.5"
windows = { version = "0.58", features = [
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

