name: Windows

# The Windows target went months without compiling because nothing built it.
# Auto builds are off for now. Run it by hand from the Actions tab
# (or ask me to trigger it) when you want a Windows build.
#
# A native runner is deliberate. Cross-compiling from Linux is blocked by
# `ring`, which arrives through `self_update` and whose build script wants MSVC
# `lib.exe`; a Windows runner has it, along with the `rc.exe` that `build.rs`
# needs to embed the icon and the manifest. The local `cargo xwin check` gate
# stays useful for fast feedback, and this is the build that proves the real
# toolchain works.
#
# To cut a release: bump the `version` in Cargo.toml, commit it, then run
# this workflow by hand from the Actions tab with that same version typed
# into the `version` input. That tags the commit `vX.Y.Z`, and publishes a
# GitHub Release carrying the Windows/Linux self-update zips (what
# src/update/mod.rs polls for) plus the NSIS installer and .deb. Leaving
# `version` blank just builds and tests, same as before — nothing gets
# tagged or published.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to publish as a GitHub Release, e.g. 0.5.0 (must already be
          set in Cargo.toml — this workflow never commits a version bump).
          Leave blank for a build-only run that publishes nothing.
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Cheap gate that runs before the expensive Windows/Linux builds. Reads the
  # version straight from Cargo.toml — that file stays the single source of
  # truth, and the `version` input is only a confirmation that you meant to
  # release this commit, not a value the workflow ever writes back.
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')
          echo "Cargo.toml version: $cargo_version"
          if [ -n "$INPUT_VERSION" ]; then
            if [ "$INPUT_VERSION" != "$cargo_version" ]; then
              echo "::error::Input version '$INPUT_VERSION' does not match Cargo.toml version '$cargo_version'. Bump Cargo.toml and commit that first."
              exit 1
            fi
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test on Windows
    needs: prepare
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Runs the suite on Windows for the first time. Every number in this
      # repo's history was measured on Linux, so a failure here is new
      # information rather than a regression.
      - name: Test
        run: cargo test --locked

      - name: Install dioxus-cli
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10

      # `dx build`, not `cargo build`. The app uses manganis `asset!()` at
      # `src/ui/app.rs` for the stylesheet and the icon, and only the dioxus
      # CLI runs the asset pipeline that resolves them. A `cargo build` binary
      # links and runs but ships unprocessed asset references, which is how the
      # main window ends up unstyled.
      #
      # `build.rs` guards on CARGO_CFG_TARGET_OS rather than a cfg attribute,
      # so the icon and the asInvoker/PerMonitorV2 manifest are embedded here.
      # winresource fails silently when it does not run, which is why the
      # manifest is extracted and checked below rather than assumed.
      - name: Build release
        run: dx build --release

      # dx puts the binary under a platform-specific profile directory rather
      # than `target/release`, so find it instead of hardcoding the path.
      - name: Locate the app binary
        id: appexe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path target -Recurse -Filter beamer.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -notmatch '\\(build|incremental)\\' } |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "dx build produced no beamer.exe" }
          Write-Host "App binary: $($exe.FullName) ($([math]::Round($exe.Length/1MB,1)) MB)"
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Verify the manifest and icon were embedded
        shell: pwsh
        run: |
          $exe = "${{ steps.appexe.outputs.path }}"
          if (-not (Test-Path $exe)) { throw "beamer.exe was not produced" }

          $mt = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter mt.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $mt) { Write-Host "::warning::mt.exe not found, skipping manifest extraction"; exit 0 }

          & $mt.FullName -nologo -inputresource:"$exe" -out:extracted.xml
          $manifest = Get-Content extracted.xml -Raw
          if ($manifest -notmatch 'asInvoker')    { throw "requestedExecutionLevel asInvoker missing" }
          if ($manifest -notmatch 'PerMonitorV2') { throw "PerMonitorV2 dpiAwareness missing" }
          Write-Host "Manifest carries asInvoker and PerMonitorV2."

      # sync_server is deliberately absent here. It runs on one machine, the
      # always-on desktop beside llama-server, and every Beamer instance
      # connects to it. Shipping a Windows copy in the app artifact invites
      # running two servers against two documents. The Linux job builds it.
      - uses: actions/upload-artifact@v5
        with:
          name: beamer-windows-portable
          path: ${{ steps.appexe.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      # `self_update` (src/update/mod.rs) matches release assets by target
      # triple substring and only knows how to unpack zip/plain archives
      # (Cargo.toml enables the `archive-zip` feature, not `archive-tar`), so
      # the self-updater needs exactly this: a flat zip with `beamer.exe` at
      # its root, named with the triple. Compress-Archive on a single file
      # input produces that flat layout already.
      - name: Build self-update archive
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ steps.appexe.outputs.path }}" -DestinationPath beamer-x86_64-pc-windows-msvc.zip

      - uses: actions/upload-artifact@v5
        with:
          name: beamer-windows-selfupdate
          path: beamer-x86_64-pc-windows-msvc.zip
          if-no-files-found: error
          retention-days: 30

      # The NSIS config in Dioxus.toml has existed since the project started
      # and had never been built. Beyond convenience, the installer is what
      # creates a Start Menu shortcut carrying a real AppUserModelID, which is
      # the only way to stop Windows branding Beamer's toasts "PowerShell".
      - name: Bundle installer
        run: dx bundle --release --package-types nsis

      - name: Locate the installer
        id: installer
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Recurse -Filter "*-setup.exe" |
                  Sort-Object Length -Descending | Select-Object -First 1
          if (-not $nsis) { throw "dx bundle produced no NSIS installer" }
          Write-Host "Installer: $($nsis.FullName) ($([math]::Round($nsis.Length/1MB,1)) MB)"
          "path=$($nsis.FullName)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v5
        with:
          name: beamer-windows-installer
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Test and bundle on Linux
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Dioxus desktop needs WebKitGTK, cpal needs ALSA, and `zip` builds the
      # self-update archive below (not preinstalled on ubuntu-latest).
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev \
            libgtk-3-dev libsoup-3.0-dev libxdo-dev pkg-config zip

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Install dioxus-cli
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10

      # `dx build`, not `cargo build` — see the same-named step in the
      # Windows job above for why: only the dioxus CLI runs the manganis
      # asset pipeline the app needs.
      - name: Build release
        run: dx build --release

      - name: Locate the app binary
        id: appexe
        run: |
          exe=$(find target -type f -name beamer -not -path '*/build/*' -not -path '*/incremental/*' -printf '%T@ %p\n' | sort -rn | head -n1 | cut -d' ' -f2-)
          if [ -z "$exe" ]; then echo "dx build produced no beamer binary"; exit 1; fi
          echo "App binary: $exe ($(du -h "$exe" | cut -f1))"
          echo "path=$exe" >> "$GITHUB_OUTPUT"

      # Same self-update contract as the Windows job: a flat zip containing
      # just the binary, named with the target triple `self_update` matches
      # against. `-j` junks the path so `beamer` lands at the zip root.
      - name: Build self-update archive
        run: zip -j beamer-x86_64-unknown-linux-gnu.zip "${{ steps.appexe.outputs.path }}"

      - uses: actions/upload-artifact@v5
        with:
          name: beamer-linux-selfupdate
          path: beamer-x86_64-unknown-linux-gnu.zip
          if-no-files-found: error
          retention-days: 30

      # sync_server belongs on the always-on desktop, so this is the build that
      # matters for it. It also has to exist at this path before the bundle
      # step below: the .deb's [bundle.deb.files] entry in Dioxus.toml copies
      # it straight out of target/release, it does not build it itself.
      # Plain cargo is right here. sync_server is headless, has no UI and no
      # manganis assets, so there is no asset pipeline for dx to run. The
      # .deb picks this binary up through [bundle.deb.files].
      - name: Build sync_server
        run: cargo build --release --locked --bin sync_server

      - uses: actions/upload-artifact@v5
        with:
          name: beamer-sync-server-linux
          path: target/release/sync_server
          if-no-files-found: error
          retention-days: 14

      # The .deb carries both beamer and sync_server. No dpkg-deb or fakeroot
      # needed: tauri-bundler builds the ar/tar.gz archive itself in pure
      # Rust, so the -dev packages already installed above are everything the
      # bundle step requires beyond dioxus-cli (installed earlier, for the
      # `dx build` self-update step).
      - name: Bundle .deb
        run: dx bundle --release --package-types deb

      - name: Locate the .deb
        id: deb
        run: |
          pkg=$(find . -name "*.deb" -printf '%s %p\n' | sort -rn | head -n1 | cut -d' ' -f2-)
          if [ -z "$pkg" ]; then echo "dx bundle produced no .deb"; exit 1; fi
          echo "Package: $pkg ($(du -h "$pkg" | cut -f1))"
          echo "path=$pkg" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: beamer-linux-deb
          path: ${{ steps.deb.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  # Only runs when the `version` input was given and matched Cargo.toml (see
  # `prepare` above). Tags the released commit and publishes everything both
  # jobs built as one GitHub Release — the two `beamer-*-selfupdate` zips are
  # what src/update/mod.rs actually finds and downloads; the installer/.deb
  # are there for people installing fresh rather than updating in place.
  release:
    name: Publish GitHub Release
    needs: [prepare, build, linux]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Tag the release commit
        env:
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist/beamer-windows-selfupdate/beamer-x86_64-pc-windows-msvc.zip \
            dist/beamer-windows-installer/*-setup.exe \
            dist/beamer-linux-selfupdate/beamer-x86_64-unknown-linux-gnu.zip \
            dist/beamer-linux-deb/*.deb
