; Beamer's local llama.cpp router configuration.
;
; Beamer does NOT spawn this server; it runs standalone and Beamer is a plain
; HTTP client. Section names must match the model ids reported by GET /v1/models,
; which are the GGUF filename stems.
;
; Backend: SYCL. Chosen by measurement on the Arc Pro B60 (2.35x Vulkan at
; prompt processing, ~1.2x at generation) — see
; docs/superpowers/benchmarks/2026-08-20-b60-llama-vulkan.md
version = 1

[*]
ctx-size = 8192
n-gpu-layers = 99
; Explicit device selection, NOT an env mask: GGML_VK_VISIBLE_DEVICES /
; ZE_AFFINITY_MASK re-index the filtered device to 0, so the mask value and the
; in-process id disagree. "device" selects from the full list, so what is
; written here is what is used. SYCL1 = Arc Pro B60. Verified, not assumed.
device = SYCL1
jinja = true

; --- Stage 1: transcript cleanup. Stays resident. ---
; Both settings below are REQUIRED by the model card, not preferences:
;  - S1-mini was trained with thinking OFF. Its embedded template is Qwen3's,
;    which defaults thinking ON; without this it emits "<think>" and stops.
;    Do not substitute reasoning-budget = 0 — the card says output degrades.
;  - The GGUF carries temp 0.6 / top_p 0.95 / top_k 20 inherited from
;    Qwen3-0.6B, which are wrong for S1-mini. It is trained for greedy decoding.
[s1-mini-q4_k_m]
chat-template-kwargs = {"enable_thinking":false}
temp = 0
top-k = 1
sleep-idle-seconds = -1
load-on-startup = true

; --- Stage 2: task extraction. Sleeps when idle. ---
; sleep-idle-seconds genuinely frees VRAM (server-context.cpp:906 calls
; destroy()), and the next request auto-reloads. ~5 GB returned after 5 min.
[gemma-4-E4B_q4_0-it]
temp = 0
sleep-idle-seconds = 300
load-on-startup = false
