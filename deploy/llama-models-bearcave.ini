; Beamer's local llama.cpp router configuration for bearcave (Windows, CPU-only).
;
; Beamer does NOT spawn this server; it runs standalone and Beamer is a plain
; HTTP client. Section names must match the model ids reported by GET
; /v1/models, which are the GGUF filename stems.
;
; This is bearcave's own preset, separate from deploy/llama-models.ini
; (callisto, SYCL/Arc-B60). The `[*]` block there carries GPU-only globals
; (device, n-gpu-layers) that don't apply here — there is no GPU backend on
; this box, that's the point. `jinja = true` still applies: it's what makes
; the chat template read `chat_template_kwargs` at all.
version = 1

[*]
ctx-size = 8192
jinja = true

; --- Task extraction. K2-Horizon-0.9B, Q8_0, CPU. ---
;
; K2-Horizon's chat template reads chat_template_kwargs.reasoning_effort
; directly and never reads enable_thinking (unlike Gemma) — there is no
; fully-off state, only high/medium/low. "low" is validated: fast (~1.3-12.4s
; per note on this CPU), no timeouts across a real batch. "medium"/"high" fix
; one known gap (a recurring-problem note misread as a task) but each
; introduces a new regression, and "high" hung past 120s on one note in
; testing. See agent_docs/local_inference.md.
;
; Kept resident (load-on-startup, sleep-idle-seconds = -1): unlike Gemma on
; callisto, this is 1.15GB with no VRAM pressure to manage on a CPU box, so
; there's no reason to pay a reload cost per note.
[K2-Horizon-0.9B-Q8_0]
chat-template-kwargs = {"reasoning_effort":"low"}
temp = 0
sleep-idle-seconds = -1
load-on-startup = true
